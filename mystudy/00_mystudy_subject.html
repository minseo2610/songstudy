<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 팀원 정보: 실제 이름·학번으로 바꿔 주세요 -->
  <meta name="author" content="팀명 | 팀원A(학번), 팀원B(학번), 팀원C(학번)">
  <meta name="team-member" content="담당: 팀원A - 과목 상세 페이지">
  <meta name="description" content="Songtudy 과목 상세: 과제·중간고사·기말고사별 할 일과 시험 일정 관리">
  <title>과목 상세 | Songtudy</title>
  <link rel="stylesheet" href="00_mystudy_common.css">
  <link rel="stylesheet" href="00_mystudy_subjects.css">
  <script src="00_mystudy_common.js" defer></script>
  <script src="../common/00_mystudy_store.js" defer></script>
  <script src="00_mystudy_subject.js" defer></script>
</head>
<body data-page="subjects" data-addr="subjects">
  <a class="skip-link" href="#main">본문 바로가기</a>

  <div class="window">
    <header class="window-tabs" data-nav></header>

    <div class="window-frame">
      <div class="window-bar" data-addr-bar></div>

      <main class="window-body" id="main">
        <nav aria-label="현재 위치">
          <ol class="breadcrumb">
            <li><a href="00_mystudy_subjects.html">과목 관리</a></li>
            <li aria-current="page" id="crumbName">과목 상세</li>
          </ol>
        </nav>

        <!-- 과목을 찾지 못했을 때 -->
        <div class="empty" id="notFound" hidden>
          <p>과목을 찾을 수 없어요. 삭제되었거나 주소가 잘못되었어요.</p>
          <a class="btn btn-primary" href="00_mystudy_subjects.html">과목 목록으로</a>
        </div>

        <!-- 불러오는 동안 보이는 자리 표시: JS가 내용을 그린 뒤 숨김 -->
        <div class="detail-loading" id="loading" aria-busy="true" aria-label="과목 불러오는 중">
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>

        <div class="window-body-stack" id="detail" hidden>
          <!-- 과목 머리 -->
          <section class="card detail-head">
            <div class="detail-title">
              <div class="detail-name-row">
                <h1 id="subjectName">과목</h1>
                <!-- 과목 수정: 연필 버튼 → 이름·색상·메모를 한 창에서 수정 -->
                <button class="icon-btn" type="button" id="editBtn" aria-label="과목 정보 수정" title="과목 정보 수정" aria-haspopup="dialog">
                  <svg class="icon" aria-hidden="true"><use href="#i-edit"></use></svg>
                </button>
              </div>
              <p class="detail-memo" id="subjectMemo" hidden></p>
              <div class="detail-progress">
                <div class="progress" id="totalBar" role="progressbar" aria-label="전체 완료율" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
                <span class="num" id="totalText">0 / 0 완료</span>
              </div>
            </div>
          </section>

          <!-- 시험 일정 -->
          <section class="card exam-section" aria-labelledby="examTitle">
            <h2 class="card-title" id="examTitle">시험 일정</h2>
            <ul class="exam-chips" id="examChips"></ul>
            <form class="exam-form" id="examForm" novalidate>
              <label class="task-field exam-name-field">시험명
                <input class="input" type="text" name="name" maxlength="20" placeholder="예: 기말고사" aria-describedby="examError">
              </label>
              <label class="task-field">시험일
                <input class="input" type="date" name="date" aria-describedby="examError">
              </label>
              <button class="btn" type="submit"><svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>시험 등록</button>
            </form>
            <p class="form-error" id="examError" role="alert"></p>
          </section>

          <!-- 할 일 묶음 -->
          <section class="exam-section" aria-labelledby="taskTitle">
            <div class="section-head">
              <h2 class="card-title" id="taskTitle">할 일</h2>
              <!-- 마감 임박 정도: 할 일 왼쪽 색 띠 -->
              <ul class="urgency-legend" aria-label="마감 색 띠 안내">
                <li><span class="urgency-swatch urg-high" aria-hidden="true"></span>1일 이내·지남</li>
                <li><span class="urgency-swatch urg-mid" aria-hidden="true"></span>3일 이내</li>
                <li><span class="urgency-swatch urg-low" aria-hidden="true"></span>여유</li>
              </ul>
              <button class="toggle" type="button" id="showDoneBtn" aria-pressed="true">
                <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
                완료한 할 일 보기
              </button>
            </div>
            <div class="group-grid" id="groupGrid"></div>
            <!-- 할 일도 시험도 없는 묶음은 접어 두고 여기 버튼으로 열기 -->
            <div class="group-add" id="groupAdd" hidden>
              <p class="group-add-text" id="groupAddText"></p>
              <div class="group-add-buttons" id="groupAddButtons"></div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <footer class="site-footer">
    <p>Songtudy 웹프로그래밍 기말 프로젝트</p>
  </footer>


  <!-- 과목 정보 수정 창: 과목 관리 페이지의 '과목 추가' 창과 같은 모양 -->
  <dialog class="modal modal-wide" id="editModal" aria-labelledby="editTitle">
    <form id="editForm" novalidate>
      <div class="modal-head">
        <h2 class="modal-title" id="editTitle">과목 수정</h2>
        <button class="icon-btn" type="button" data-close aria-label="닫기"><svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg></button>
      </div>

      <div class="modal-body">
        <div class="form-row">
          <label class="form-row-label" for="editName">과목명 <span class="req" aria-hidden="true">*</span></label>
          <div class="form-row-field">
            <input class="input" type="text" id="editName" name="name" maxlength="20"
                   required aria-required="true" aria-describedby="editNameCount editNameError">
            <span class="count count-end" id="editNameCount" aria-live="polite"><b>0</b>/20</span>
            <p class="form-error" id="editNameError" role="alert"></p>
          </div>
        </div>

        <div class="form-row">
          <span class="form-row-label" id="editColorLabel">과목 색상</span>
          <div class="form-row-field">
            <fieldset class="swatches" id="colorPicker" aria-labelledby="editColorLabel"></fieldset>
          </div>
        </div>

        <div class="form-row">
          <label class="form-row-label" for="editMemo">메모</label>
          <div class="form-row-field">
            <textarea class="input textarea" id="editMemo" name="memo" maxlength="100" rows="3"
                      placeholder="예: 김OO 교수님, 공학관 301호, 화·목 10시" aria-describedby="editMemoCount"></textarea>
            <span class="count count-end" id="editMemoCount" aria-live="polite"><b>0</b>/100</span>
          </div>
        </div>
      </div>

      <div class="modal-foot">
        <button class="btn" type="button" data-close>취소</button>
        <button class="btn btn-primary" type="submit">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 할 일 추가 창: 묶음 카드에는 목록만 두고 입력은 여기서 -->
  <dialog class="modal" id="taskModal" aria-labelledby="taskModalTitle">
    <form id="taskForm" novalidate>
      <div class="modal-head">
        <h2 class="modal-title" id="taskModalTitle">할 일 추가</h2>
        <button class="icon-btn" type="button" data-close aria-label="닫기"><svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg></button>
      </div>

      <div class="modal-body task-modal-body">
        <fieldset class="task-cat">
          <legend class="task-cat-legend">묶음</legend>
          <div class="task-cat-options" id="taskCatOptions"></div>
        </fieldset>

        <label class="task-field" for="taskTitleInput">할 일 <span class="req" aria-hidden="true">*</span></label>
        <div class="task-modal-field">
          <input class="input" type="text" id="taskTitleInput" name="title" maxlength="40"
                 placeholder="예: 3장 요약하기" required aria-required="true" aria-describedby="taskTitleCount taskTitleError">
          <span class="count count-end" id="taskTitleCount" aria-live="polite"><b>0</b>/40</span>
          <p class="form-error" id="taskTitleError" role="alert"></p>
        </div>

        <label class="task-field" for="taskDueInput">마감일</label>
        <input class="input" type="date" id="taskDueInput" name="dueDate">
      </div>

      <div class="modal-foot">
        <button class="btn" type="button" data-close>취소</button>
        <button class="btn btn-primary" type="submit">추가</button>
      </div>
    </form>
  </dialog>

  <!-- 묶음 카드 틀: JS가 과제 / 중간고사 준비 / 기말고사 준비 3개를 복제해 채움 -->
  <template id="groupTemplate">
    <section class="card group">
      <div class="group-head">
        <h3 class="group-label"></h3>
        <span class="group-done-mark"><svg class="icon" aria-hidden="true"><use href="#i-star"></use></svg>모두 완료</span>
        <button class="btn btn-sm group-add-task" type="button" data-add-task><svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>할 일</button>
      </div>
      <p class="group-count num"><strong class="group-done"></strong><span class="group-total"></span></p>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span></span></div>
      <ul class="task-list todo-list"></ul>
      <div class="done-area">
        <p class="done-label">완료 <span class="num done-count"></span></p>
        <ul class="task-list done-list"></ul>
      </div>
    </section>
  </template>
</body>
</html>
